<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Flow - 專注統計系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Zen Maru Gothic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase JS SDK (v11.6.1 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            GoogleAuthProvider, 
            signInWithPopup, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            getDoc, 
            collection, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase Environment & Config
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'focus-flow-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined'
            ? JSON.parse(__firebase_config)
            : {
                apiKey: "AIzaSyA_iLrEGp9HD9Vw11rO8NV96lhsJdlLZRc",
                authDomain: "focusflow-cf2be.firebaseapp.com",
                projectId: "focusflow-cf2be",
                storageBucket: "focusflow-cf2be.firebasestorage.app",
                messagingSenderId: "155744823743",
                appId: "1:155744823743:web:45566e04913b0b975d190a",
                measurementId: "G-XK9XD3NEPG"
              };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Initial Auth Setup (Custom token or fallback to anonymous if needed)
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        if (initialAuthToken) {
            signInWithCustomToken(auth, initialAuthToken).catch(err => {
                console.warn('Initial token signin fallback:', err);
            });
        }

        // Expose Firebase services globally for React components
        window.FirebaseServices = {
            appId,
            firebaseConfig,
            auth,
            db,
            GoogleAuthProvider,
            signInWithPopup,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged,
            doc,
            setDoc,
            getDoc,
            collection,
            onSnapshot
        };
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#B5BDB9',
                        morandi: {
                            50: '#f4f7f5',
                            100: '#e3eae6',
                            200: '#c8d6cf',
                            300: '#a4bcaf',
                            400: '#81a396',
                            500: '#5e8778',
                            600: '#486e60',
                            700: '#38564b',
                            800: '#2c433b',
                            900: '#1d2a25',
                            darkBg: '#182420'
                        }
                    },
                    fontFamily: {
                        sans: ['"Zen Maru Gothic"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #182420;
            color: #eaf0ec;
            user-select: none;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 0.3s ease-in-out;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(24, 36, 32, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #3d544b;
            border-radius: 9999px;
        }
        .glow-btn {
            box-shadow: 0 0 18px rgba(181, 189, 185, 0.3);
            transition: all 0.2s ease-in-out;
        }
        .glow-btn:hover {
            box-shadow: 0 0 26px rgba(181, 189, 185, 0.5);
            transform: translateY(-1px);
        }
        .timer-running-pulse {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% {
                box-shadow: 0 0 0 0 rgba(181, 189, 185, 0.4);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(181, 189, 185, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(181, 189, 185, 0);
            }
        }
        /* Range slider styling */
        input[type="range"] {
            accent-color: #B5BDB9;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brand selection:text-morandi-900">
    <div id="root" class="w-full flex-grow flex flex-col"></div>

    <script type="text/babel">
        const MORANDI_PALETTE = [
            { id: 'green', name: '靜謐綠', hex: '#81A396' },
            { id: 'blue', name: '霧藍', hex: '#6C8EAD' },
            { id: 'pink', name: '莫蘭迪粉', hex: '#C48B9F' },
            { id: 'amber', name: '燕麥黃', hex: '#D4A373' },
            { id: 'purple', name: '薰衣紫', hex: '#8B7E9B' },
            { id: 'orange', name: '赤陶橘', hex: '#C87D55' },
            { id: 'teal', name: '尤加利青', hex: '#5B8266' }
        ];

        const playBeep = (type = 'finish') => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'finish') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15);
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.6);
                } else if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, ctx.currentTime);
                    gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.05);
                }
            } catch (e) {
                console.log('Audio Context error:', e);
            }
        };

        const DEFAULT_TASKS = [
            { id: '1', name: '企業倫理', icon: 'fa-building', color: '#81A396' },
            { id: '2', name: '日文學習', icon: 'fa-language', color: '#D4A373' },
            { id: '3', name: '家事整理', icon: 'fa-broom', color: '#6C8EAD' },
            { id: '4', name: '程式開發', icon: 'fa-code', color: '#8B7E9B' },
            { id: '5', name: '閱讀成長', icon: 'fa-book-open', color: '#C87D55' }
        ];

        const formatDate = (date) => {
            const d = new Date(date);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        function App() {
            const [currentTab, setCurrentTab] = React.useState('timer');

            // Auth States
            const [user, setUser] = React.useState(null);
            const [isAuthModalOpen, setIsAuthModalOpen] = React.useState(false);
            const [authNotice, setAuthNotice] = React.useState('');

            // Timer States
            const [mode, setMode] = React.useState('focus');
            const [timerType, setTimerType] = React.useState('pomodoro');
            
            const [modeDurations] = React.useState({
                focus: 25 * 60,
                shortBreak: 5 * 60,
                longBreak: 15 * 60
            });

            const [seconds, setSeconds] = React.useState(25 * 60);
            const [elapsedStopwatch, setElapsedStopwatch] = React.useState(0);
            const [isRunning, setIsRunning] = React.useState(false);
            const [sessionCount, setSessionCount] = React.useState(1);

            // Background & Transparency State
            const [bgImage, setBgImage] = React.useState(() => {
                return localStorage.getItem('ff_bg_image') || '';
            });

            const [bgOpacity, setBgOpacity] = React.useState(() => {
                const savedOpacity = localStorage.getItem('ff_bg_opacity');
                return savedOpacity !== null ? parseFloat(savedOpacity) : 0.78;
            });

            const [bgBlur, setBgBlur] = React.useState(() => {
                const savedBlur = localStorage.getItem('ff_bg_blur');
                return savedBlur !== null ? parseInt(savedBlur, 10) : 8;
            });

            const [showOpacitySlider, setShowOpacitySlider] = React.useState(false);

            // Image Crop Modal States
            const [cropModalOpen, setCropModalOpen] = React.useState(false);
            const [rawImageSrc, setRawImageSrc] = React.useState('');

            // Tasks & Records
            const [tasks, setTasks] = React.useState(() => {
                const saved = localStorage.getItem('ff_tasks_morandi');
                return saved ? JSON.parse(saved) : DEFAULT_TASKS;
            });
            const [selectedTaskId, setSelectedTaskId] = React.useState(tasks[0]?.id || '1');
            const [isEditingTaskModal, setIsEditingTaskModal] = React.useState(false);
            const [editingTaskData, setEditingTaskData] = React.useState(null);

            const [records, setRecords] = React.useState(() => {
                const saved = localStorage.getItem('ff_records_morandi');
                return saved ? JSON.parse(saved) : [];
            });

            // Firebase Auth Listener
            React.useEffect(() => {
                if (!window.FirebaseServices) return;
                const { auth, onAuthStateChanged } = window.FirebaseServices;
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                });
                return () => unsubscribe();
            }, []);

            // Firestore Synchronization for User Data
            React.useEffect(() => {
                if (!user || !window.FirebaseServices) return;
                const { db, appId, collection, onSnapshot, doc, setDoc } = window.FirebaseServices;

                // Sync Tasks Path: /artifacts/{appId}/users/{userId}/tasks
                const tasksColRef = collection(db, 'artifacts', appId, 'users', user.uid, 'tasks');
                const unsubscribeTasks = onSnapshot(tasksColRef, (snapshot) => {
                    if (!snapshot.empty) {
                        const fetchedTasks = [];
                        snapshot.forEach(doc => fetchedTasks.push({ id: doc.id, ...doc.data() }));
                        setTasks(fetchedTasks);
                        localStorage.setItem('ff_tasks_morandi', JSON.stringify(fetchedTasks));
                    } else {
                        // First time sync default tasks
                        tasks.forEach(t => {
                            setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', t.id), t);
                        });
                    }
                }, (error) => {
                    console.error("Firestore tasks sync error:", error);
                });

                // Sync Records Path: /artifacts/{appId}/users/{userId}/records
                const recordsColRef = collection(db, 'artifacts', appId, 'users', user.uid, 'records');
                const unsubscribeRecords = onSnapshot(recordsColRef, (snapshot) => {
                    const fetchedRecords = [];
                    snapshot.forEach(doc => fetchedRecords.push({ id: doc.id, ...doc.data() }));

                    // Read local records
                    const localRecords = JSON.parse(localStorage.getItem('ff_records_morandi') || '[]');
                    
                    // Merge local and cloud records (deduplicate by record ID)
                    const recordMap = new Map();
                    localRecords.forEach(r => recordMap.set(r.id, r));
                    fetchedRecords.forEach(r => recordMap.set(r.id, r));

                    const mergedRecords = Array.from(recordMap.values());

                    // Auto-upload local records that are not yet in Firestore
                    localRecords.forEach(r => {
                        if (!fetchedRecords.some(fr => fr.id === r.id)) {
                            setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'records', r.id), r)
                                .catch(err => console.error("Error uploading local record to Firestore:", err));
                        }
                    });

                    setRecords(mergedRecords);
                    localStorage.setItem('ff_records_morandi', JSON.stringify(mergedRecords));
                }, (error) => {
                    console.error("Firestore records sync error:", error);
                });

                return () => {
                    unsubscribeTasks();
                    unsubscribeRecords();
                };
            }, [user]);

            // Save Tasks changes to Firestore & LocalStorage
            const updateTasksWithSync = (newTasks) => {
                setTasks(newTasks);
                localStorage.setItem('ff_tasks_morandi', JSON.stringify(newTasks));
                if (user && window.FirebaseServices) {
                    const { db, appId, doc, setDoc } = window.FirebaseServices;
                    newTasks.forEach(t => {
                        setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'tasks', t.id), t).catch(err => console.error(err));
                    });
                }
            };

            // Save Records changes to Firestore & LocalStorage
            const updateRecordsWithSync = (newRecord) => {
                setRecords(prev => {
                    const updated = [...prev, newRecord];
                    localStorage.setItem('ff_records_morandi', JSON.stringify(updated));
                    return updated;
                });

                if (user && window.FirebaseServices) {
                    const { db, appId, doc, setDoc } = window.FirebaseServices;
                    setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'records', newRecord.id), newRecord).catch(err => console.error(err));
                }
            };

            React.useEffect(() => {
                localStorage.setItem('ff_bg_opacity', bgOpacity.toString());
            }, [bgOpacity]);

            React.useEffect(() => {
                localStorage.setItem('ff_bg_blur', bgBlur.toString());
            }, [bgBlur]);

            React.useEffect(() => {
                if (bgImage) {
                    document.body.style.backgroundImage = `url(${bgImage})`;
                } else {
                    document.body.style.backgroundImage = 'none';
                }
            }, [bgImage]);

            const handleFileSelect = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setRawImageSrc(reader.result);
                        setCropModalOpen(true);
                    };
                    reader.readAsDataURL(file);
                }
                e.target.value = null;
            };

            const handleCropSave = (croppedDataUrl) => {
                setBgImage(croppedDataUrl);
                try {
                    localStorage.setItem('ff_bg_image', croppedDataUrl);
                } catch (err) {
                    console.warn('LocalStorage limit exceeded for background image');
                }
                setCropModalOpen(false);
                setRawImageSrc('');
            };

            const clearBgImage = () => {
                setBgImage('');
                localStorage.removeItem('ff_bg_image');
            };

            React.useEffect(() => {
                if (!isRunning) {
                    if (timerType === 'pomodoro') {
                        setSeconds(modeDurations[mode] || 25 * 60);
                    } else {
                        setElapsedStopwatch(0);
                    }
                }
            }, [mode, timerType, modeDurations]);

            React.useEffect(() => {
                let timer = null;
                if (isRunning) {
                    timer = setInterval(() => {
                        if (timerType === 'pomodoro') {
                            setSeconds((prev) => {
                                if (prev <= 1) {
                                    clearInterval(timer);
                                    handleSessionComplete();
                                    return 0;
                                }
                                return prev - 1;
                            });
                        } else {
                            setElapsedStopwatch((prev) => prev + 1);
                        }
                    }, 1000);
                } else {
                    clearInterval(timer);
                }
                return () => clearInterval(timer);
            }, [isRunning, timerType, mode, seconds]);

            const handleSessionComplete = () => {
                setIsRunning(false);
                playBeep('finish');
                
                const duration = timerType === 'pomodoro' ? modeDurations[mode] : elapsedStopwatch;
                if (duration > 0) {
                    const newRecord = {
                        id: Date.now().toString(),
                        taskId: selectedTaskId,
                        mode: mode,
                        durationSeconds: duration,
                        timestamp: Date.now(),
                        date: formatDate(new Date())
                    };
                    updateRecordsWithSync(newRecord);
                    
                    if (mode === 'focus') {
                        setSessionCount(prev => prev + 1);
                    }
                }
            };

            const toggleTimer = () => {
                playBeep('click');
                if (isRunning && timerType === 'stopwatch') {
                    handleSessionComplete();
                } else {
                    setIsRunning(!isRunning);
                }
            };

            const resetTimer = () => {
                playBeep('click');
                setIsRunning(false);
                if (timerType === 'pomodoro') {
                    setSeconds(modeDurations[mode]);
                } else {
                    setElapsedStopwatch(0);
                }
            };

            const generateMockData = () => {
                const mockRecords = [];
                const now = new Date();
                const taskIds = tasks.map(t => t.id);

                for (let i = 0; i < 14; i++) {
                    const dateObj = new Date(now);
                    dateObj.setDate(now.getDate() - i);
                    const dateStr = formatDate(dateObj);

                    const sessionsCount = Math.floor(Math.random() * 4) + 2;
                    for (let s = 0; s < sessionsCount; s++) {
                        const randomTask = taskIds[Math.floor(Math.random() * taskIds.length)];
                        const isFocus = Math.random() > 0.25;
                        const modeType = isFocus ? 'focus' : (Math.random() > 0.5 ? 'shortBreak' : 'longBreak');
                        const dur = isFocus ? (25 * 60) : (modeType === 'shortBreak' ? 5 * 60 : 15 * 60);

                        const r = {
                            id: `mock-${i}-${s}`,
                            taskId: randomTask,
                            mode: modeType,
                            durationSeconds: dur,
                            timestamp: dateObj.getTime() - (s * 3600 * 1000),
                            date: dateStr
                        };
                        mockRecords.push(r);
                        if (user && window.FirebaseServices) {
                            const { db, appId, doc, setDoc } = window.FirebaseServices;
                            setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'records', r.id), r);
                        }
                    }
                }
                setRecords(mockRecords);
            };

            return (
                <div 
                    style={{ 
                        backgroundColor: `rgba(20, 31, 27, ${bgOpacity})`, 
                        backdropFilter: bgBlur > 0 ? `blur(${bgBlur}px)` : 'none',
                        WebkitBackdropFilter: bgBlur > 0 ? `blur(${bgBlur}px)` : 'none'
                    }}
                    class="flex-grow flex flex-col justify-between max-w-6xl mx-auto w-full px-4 py-4 md:py-6 my-0 md:my-4 rounded-3xl shadow-2xl border border-morandi-700/40 transition-all duration-200"
                >
                    {/* Header Bar */}
                    <header class="flex flex-wrap justify-between items-center gap-4 mb-6 border-b border-morandi-700/60 pb-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-2xl bg-[#B5BDB9] flex items-center justify-center text-morandi-900 font-bold text-xl shadow-lg">
                                <i class="fa-solid fa-leaf"></i>
                            </div>
                            <span class="text-xl md:text-2xl font-bold tracking-wide text-[#B5BDB9]">FocusFlow</span>
                        </div>

                        {/* Top Nav Tabs */}
                        <nav class="flex items-center bg-morandi-900/80 p-1.5 rounded-2xl border border-morandi-700/60">
                            <button
                                onClick={() => { playBeep('click'); setCurrentTab('timer'); }}
                                class={`flex items-center space-x-2 px-4 py-2 rounded-xl text-sm md:text-base font-medium transition-all ${
                                    currentTab === 'timer'
                                        ? 'bg-[#B5BDB9] text-morandi-900 font-bold shadow-md'
                                        : 'text-morandi-200 hover:text-white'
                                }`}
                            >
                                <i class="fa-solid fa-stopwatch"></i>
                                <span>計時器</span>
                            </button>

                            <button
                                onClick={() => { playBeep('click'); setCurrentTab('stats'); }}
                                class={`flex items-center space-x-2 px-4 py-2 rounded-xl text-sm md:text-base font-medium transition-all ${
                                    currentTab === 'stats'
                                        ? 'bg-[#B5BDB9] text-morandi-900 font-bold shadow-md'
                                        : 'text-morandi-200 hover:text-white'
                                }`}
                            >
                                <i class="fa-solid fa-chart-pie"></i>
                                <span>統計分析</span>
                            </button>

                            <button
                                onClick={() => { playBeep('click'); setCurrentTab('tasks'); }}
                                class={`flex items-center space-x-2 px-4 py-2 rounded-xl text-sm md:text-base font-medium transition-all ${
                                    currentTab === 'tasks'
                                        ? 'bg-[#B5BDB9] text-morandi-900 font-bold shadow-md'
                                        : 'text-morandi-200 hover:text-white'
                                }`}
                            >
                                <i class="fa-solid fa-list-check"></i>
                                <span>待辦項目</span>
                            </button>
                        </nav>

                        {}
                        {/* Header Actions: Auth Login & Visual Controls */}
                        <div class="flex items-center space-x-2">
                            {/* User Auth Button */}
                            <button
                                onClick={() => setIsAuthModalOpen(true)}
                                class={`px-3 py-2 rounded-xl text-xs font-semibold flex items-center space-x-1.5 border transition-all shadow-sm ${
                                    user 
                                        ? 'bg-emerald-900/60 border-emerald-500/60 text-emerald-200 hover:bg-emerald-800/80' 
                                        : 'bg-morandi-800/90 border-[#B5BDB9]/40 text-[#B5BDB9] hover:bg-morandi-700'
                                }`}
                            >
                                <i class={`fa-solid ${user ? 'fa-cloud-check' : 'fa-user-lock'}`}></i>
                                <span>{user ? (user.email ? user.email.split('@')[0] : '已雲端同步') : '帳號登入 / 同步'}</span>
                            </button>

                            {/* Transparency & Blur Controls */}
                            <div class="relative">
                                <button
                                    onClick={() => setShowOpacitySlider(!showOpacitySlider)}
                                    title="調整視覺與模糊度"
                                    class={`bg-morandi-800/90 hover:bg-morandi-700 text-[#B5BDB9] border border-[#B5BDB9]/40 px-3 py-2 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition-all shadow-sm ${showOpacitySlider ? 'ring-2 ring-[#B5BDB9]' : ''}`}
                                >
                                    <i class="fa-solid fa-sliders"></i>
                                    <span>視覺效果</span>
                                </button>

                                {showOpacitySlider && (
                                    <div class="absolute top-12 right-0 bg-morandi-900 border border-morandi-600 p-4 rounded-2xl shadow-2xl z-30 w-60 flex flex-col space-y-4">
                                        <div class="flex flex-col space-y-1">
                                            <div class="flex justify-between text-xs text-morandi-200 font-medium">
                                                <span>不透明度</span>
                                                <span class="font-mono text-[#B5BDB9]">{Math.round(bgOpacity * 100)}%</span>
                                            </div>
                                            <input
                                                type="range"
                                                min="0.0"
                                                max="1.0"
                                                step="0.02"
                                                value={bgOpacity}
                                                onChange={(e) => setBgOpacity(parseFloat(e.target.value))}
                                                class="w-full cursor-pointer h-2 bg-morandi-700 rounded-lg appearance-none"
                                            />
                                            <div class="flex justify-between text-[10px] text-morandi-300">
                                                <span>完全透明</span>
                                                <span>不透明</span>
                                            </div>
                                        </div>

                                        <div class="flex flex-col space-y-1 pt-2 border-t border-morandi-700/60">

        function AuthModal({ user, onClose }) {
            const [isRegisterMode, setIsRegisterMode] = React.useState(false);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [errorMsg, setErrorMsg] = React.useState('');
            const [successMsg, setSuccessMsg] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);

            const checkDemoConfig = () => {
                if (window.FirebaseServices?.firebaseConfig?.apiKey?.includes('DemoConfigKey')) {
                    setErrorMsg('💡 目前為本機開啟模式（file://）。Google 與 Email 雲端同步需設置真實 Firebase API Key。別擔心！您的所有計時與紀錄已自動儲存在此瀏覽器本機中，可直接正常使用！');
                    return true;
                }
                return false;
            };

            const handleGoogleLogin = async () => {
                if (!window.FirebaseServices) return;
                setIsLoading(true);
                setErrorMsg('');

                if (checkDemoConfig()) {
                    setIsLoading(false);
                    return;
                }

                try {
                    const { auth, GoogleAuthProvider, signInWithPopup } = window.FirebaseServices;
                    const provider = new GoogleAuthProvider();
                    await signInWithPopup(auth, provider);
                    setSuccessMsg('Google 帳號登入成功！數據已同步。');
                    setTimeout(() => onClose(), 1200);
                } catch (err) {
                    console.error('Google Sign-in Error:', err);
                    let readableErr = err.message;
                    if (err.code === 'auth/api-key-not-valid') {
                        readableErr = '💡 目前為本機開啟模式，未設定有效 Firebase API Key。本機數據已自動保存在您的瀏覽器中！';
                    }
                    setErrorMsg(readableErr);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleEmailAuth = async (e) => {
                e.preventDefault();
                if (!email || !password) {
                    setErrorMsg('請輸入完整的 Email 與密碼');
                    return;
                }
                if (!window.FirebaseServices) return;

                setIsLoading(true);
                setErrorMsg('');
                setSuccessMsg('');

                if (checkDemoConfig()) {
                    setIsLoading(false);
                    return;
                }

                try {
                    const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.FirebaseServices;
                    if (isRegisterMode) {
                        await createUserWithEmailAndPassword(auth, email, password);
                        setSuccessMsg('帳號註冊成功並已自動登入！');
                    } else {
                        await signInWithEmailAndPassword(auth, email, password);
                        setSuccessMsg('登入成功！資料同步中...');
                    }
                    setTimeout(() => onClose(), 1200);
                } catch (err) {
                    console.error('Email Auth Error:', err);
                    let readableErr = err.message;
                    if (err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') readableErr = 'Email 或密碼不正確';
                    if (err.code === 'auth/email-already-in-use') readableErr = '此 Email 已被註冊';
                    if (err.code === 'auth/weak-password') readableErr = '密碼長度需至少 6 個字元';
                    if (err.code === 'auth/api-key-not-valid') readableErr = '💡 本機模式下未設定 Firebase API Key，數據已自動保存在本機瀏覽器中！';
                    setErrorMsg(readableErr);
                } finally {
                    setIsLoading(false);
                }
            };

            const handleSignOut = async () => {
                if (!window.FirebaseServices) return;
                try {
                    const { auth, signOut } = window.FirebaseServices;
                    await signOut(auth);
                    setSuccessMsg('已成功登出');
                    setTimeout(() => onClose(), 800);
                } catch (err) {
                    setErrorMsg('登出失敗');
                }
            };

            return (
                <div class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4">
                    <div class="bg-morandi-900 border border-morandi-600 w-full max-w-md rounded-3xl p-6 shadow-2xl relative flex flex-col space-y-4">
                        <div class="flex justify-between items-center border-b border-morandi-700/80 pb-3">
                            <h3 class="text-base font-bold text-[#B5BDB9] flex items-center space-x-2">
                                <i class="fa-solid fa-cloud"></i>
                                <span>跨裝置數據同步 (Google / Email)</span>
                            </h3>
                            <button onClick={onClose} class="text-morandi-300 hover:text-white">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        {/* Error & Success Banners */}
                        {errorMsg && (
                            <div class="bg-rose-900/60 border border-rose-500/80 text-rose-200 text-xs p-3 rounded-xl flex items-center space-x-2">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                                <span>{errorMsg}</span>
                            </div>
                        )}
                        {successMsg && (
                            <div class="bg-emerald-900/60 border border-emerald-500/80 text-emerald-200 text-xs p-3 rounded-xl flex items-center space-x-2">
                                <i class="fa-solid fa-circle-check"></i>
                                <span>{successMsg}</span>
                            </div>
                        )}

                        {user ? (
                            /* Logged In View */
                            <div class="space-y-4">
                                <div class="bg-morandi-800/80 border border-morandi-700 p-4 rounded-2xl space-y-2">
                                    <div class="text-xs text-morandi-300">目前登入狀態</div>
                                    <div class="text-sm font-bold text-[#B5BDB9] flex items-center space-x-2">
                                        <i class="fa-solid fa-circle-user text-emerald-400"></i>
                                        <span>{user.email || '已驗證使用者'}</span>
                                    </div>
                                    <div class="pt-2 border-t border-morandi-700/60 flex flex-col space-y-1">
                                        <span class="text-[11px] text-morandi-300">使用者 ID (UID)：</span>
                                        <span class="font-mono text-xs text-morandi-100 bg-morandi-900 p-2 rounded-xl break-all select-all border border-morandi-700">
                                            {user.uid}
                                        </span>
                                    </div>
                                </div>

                                <button
                                    onClick={handleSignOut}
                                    class="w-full py-2.5 bg-rose-800/80 hover:bg-rose-700 text-white text-xs font-bold rounded-xl transition-all shadow-md flex items-center justify-center space-x-2"
                                >
                                    <i class="fa-solid fa-right-from-bracket"></i>
                                    <span>登出此帳號</span>
                                </button>
                            </div>
                        ) : (
                            /* Login / Register View */
                            <div class="space-y-4">
                                {/* Google Auth Quick Button */}
                                <button
                                    onClick={handleGoogleLogin}
                                    disabled={isLoading}
                                    class="w-full py-3 bg-white hover:bg-slate-100 text-slate-800 font-bold text-xs rounded-xl transition-all shadow-md flex items-center justify-center space-x-2 border border-slate-300"
                                >
                                    <i class="fa-brands fa-google text-red-500 text-base"></i>
                                    <span>使用 Google 帳號快速登入</span>
                                </button>

                                <div class="flex items-center my-2">
                                    <div class="flex-grow border-t border-morandi-700"></div>
                                    <span class="px-3 text-[11px] text-morandi-400 font-medium">或使用 Email 登入</span>
                                    <div class="flex-grow border-t border-morandi-700"></div>
                                </div>

                                <form onSubmit={handleEmailAuth} class="space-y-3">
                                    <div>
                                        <label class="block text-xs text-morandi-300 mb-1">Email 信箱</label>
                                        <input
                                            type="email"
                                            placeholder="example@email.com"
                                            value={email}
                                            onChange={(e) => setEmail(e.target.value)}
                                            class="w-full bg-morandi-800 border border-morandi-700 text-white rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-[#B5BDB9]"
                                            required
                                        />
                                    </div>

                                    <div>
                                        <label class="block text-xs text-morandi-300 mb-1">密碼</label>
                                        <input
                                            type="password"
                                            placeholder="請輸入密碼 (至少 6 位)"
                                            value={password}
                                            onChange={(e) => setPassword(e.target.value)}
                                            class="w-full bg-morandi-800 border border-morandi-700 text-white rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-[#B5BDB9]"
                                            required
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        disabled={isLoading}
                                        class="w-full py-2.5 bg-[#B5BDB9] hover:bg-white text-morandi-900 font-bold text-xs rounded-xl transition-all shadow-md mt-2"
                                    >
                                        {isLoading ? '處理中...' : (isRegisterMode ? '註冊新帳號' : '登入')}
                                    </button>
                                </form>

                                <div class="text-center pt-2 border-t border-morandi-700/60">
                                    <button
                                        onClick={() => {
                                            setIsRegisterMode(!isRegisterMode);
                                            setErrorMsg('');
                                        }}
                                        class="text-xs text-[#B5BDB9] hover:underline"
                                    >
                                        {isRegisterMode ? '已有帳號？點此切換登入' : '還沒有帳號？點此免費註冊'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function ImageCropModal({ imageSrc, onSave, onClose, currentOpacity, currentBlur }) {
            const canvasRef = React.useRef(null);
            const [zoom, setZoom] = React.useState(1);
            const [pan, setPan] = React.useState({ x: 0, y: 0 });
            const [isDragging, setIsDragging] = React.useState(false);
            const [dragStart, setDragStart] = React.useState({ x: 0, y: 0 });
            const [isPreviewOverlay, setIsPreviewOverlay] = React.useState(true);
            const imgRef = React.useRef(null);

            React.useEffect(() => {
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    imgRef.current = img;
                    drawCanvas();
                };
                img.src = imageSrc;
            }, [imageSrc]);

            React.useEffect(() => {
                if (imgRef.current) {
                    drawCanvas();
                }
            }, [zoom, pan]);

            const drawCanvas = () => {
                const canvas = canvasRef.current;
                if (!canvas || !imgRef.current) return;
                const ctx = canvas.getContext('2d');
                const img = imgRef.current;

                // Canvas dimensions (aspect ratio ~16:9 standard background)
                canvas.width = 1280;
                canvas.height = 720;

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Calculate scaled dimensions to cover canvas
                const scale = Math.max(canvas.width / img.width, canvas.height / img.height) * zoom;
                const width = img.width * scale;
                const height = img.height * scale;

                const x = (canvas.width - width) / 2 + pan.x;
                const y = (canvas.height - height) / 2 + pan.y;

                ctx.drawImage(img, x, y, width, height);
            };

            const handleMouseDown = (e) => {
                setIsDragging(true);
                setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
            };

            const handleMouseMove = (e) => {
                if (!isDragging) return;
                setPan({
                    x: e.clientX - dragStart.x,
                    y: e.clientY - dragStart.y
                });
            };

            const handleMouseUp = () => {
                setIsDragging(false);
            };

            const handleConfirm = () => {
                const canvas = canvasRef.current;
                if (canvas) {
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.88);
                    onSave(dataUrl);
                }
            };

            return (
                <div class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto">
                    <div class="bg-morandi-900 border border-morandi-600 w-full max-w-3xl rounded-3xl p-6 shadow-2xl relative flex flex-col space-y-4">
                        <div class="flex justify-between items-center border-b border-morandi-700/80 pb-3">
                            <h3 class="text-base font-bold text-[#B5BDB9] flex items-center space-x-2">
                                <i class="fa-solid fa-crop text-[#B5BDB9]"></i>
                                <span>背景圖片裁切與預覽</span>
                            </h3>
                            <button onClick={onClose} class="text-morandi-300 hover:text-white">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        {/* Interactive Canvas Viewport */}
                        <div class="relative w-full overflow-hidden rounded-2xl border border-morandi-600 bg-black flex items-center justify-center select-none cursor-grab active:cursor-grabbing"
                            onMouseDown={handleMouseDown}
                            onMouseMove={handleMouseMove}
                            onMouseUp={handleMouseUp}
                            onMouseLeave={handleMouseUp}
                            style={{ aspectRatio: '16/9' }}
                        >
                            <canvas ref={canvasRef} class="w-full h-full object-contain"></canvas>

                            {/* Simulated UI Overlay to preview text & buttons contrast */}
                            {isPreviewOverlay && (
                                <div 
                                    style={{ 
                                        backgroundColor: `rgba(20, 31, 27, ${currentOpacity})`,
                                        backdropFilter: currentBlur > 0 ? `blur(${currentBlur}px)` : 'none',
                                        WebkitBackdropFilter: currentBlur > 0 ? `blur(${currentBlur}px)` : 'none'
                                    }}
                                    class="absolute inset-4 rounded-2xl border border-[#B5BDB9]/40 p-4 flex flex-col justify-between pointer-events-none transition-all"
                                >
                                    <div class="flex justify-between items-center text-xs text-[#B5BDB9] font-bold">
                                        <span>🍃 FocusFlow (預覽視窗)</span>
                                        <span class="bg-morandi-800/80 px-2 py-1 rounded-lg">透光度: {Math.round(currentOpacity * 100)}% | 模糊: {currentBlur}px</span>
                                    </div>
                                    <div class="text-center">
                                        <div class="text-4xl font-mono font-bold text-[#B5BDB9]">25:00</div>
                                    </div>
                                    <div class="text-center text-[11px] text-morandi-300">
                                        拖拽圖片以調整位置、使用下方拉桿縮放
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Controls Bar */}
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-center bg-morandi-800/60 p-3 rounded-2xl border border-morandi-700/60">
                            {/* Zoom Slider */}
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid fa-magnifying-glass-minus text-xs text-morandi-300"></i>
                                <input
                                    type="range"
                                    min="1"
                                    max="2.5"
                                    step="0.05"
                                    value={zoom}
                                    onChange={(e) => setZoom(parseFloat(e.target.value))}
                                    class="w-full h-1.5 bg-morandi-700 rounded-lg appearance-none cursor-pointer"
                                />
                                <i class="fa-solid fa-magnifying-glass-plus text-xs text-morandi-300"></i>
                                <span class="text-xs text-[#B5BDB9] font-mono shrink-0">{Math.round(zoom * 100)}%</span>
                            </div>

                            {/* Preview Mode Switcher */}
                            <div class="flex items-center justify-end space-x-3">
                                <button
                                    onClick={() => { setZoom(1); setPan({ x: 0, y: 0 }); }}
                                    class="px-3 py-1.5 bg-morandi-700 hover:bg-morandi-600 text-xs text-morandi-200 rounded-xl transition-all"
                                >
                                    重置位置
                                </button>
                                <button
                                    onClick={() => setIsPreviewOverlay(!isPreviewOverlay)}
                                    class={`px-3 py-1.5 text-xs rounded-xl font-semibold transition-all border ${
                                        isPreviewOverlay
                                            ? 'bg-[#B5BDB9] text-morandi-900 border-[#B5BDB9]'
                                            : 'bg-morandi-800 text-morandi-300 border-morandi-600'
                                    }`}
                                >
                                    <i class="fa-solid fa-eye mr-1"></i>
                                    {isPreviewOverlay ? '遮罩預覽：開啟' : '遮罩預覽：關閉'}
                                </button>
                            </div>
                        </div>

                        {/* Action Buttons */}
                        <div class="flex justify-end space-x-3 pt-2">
                            <button
                                type="button"
                                onClick={onClose}
                                class="px-5 py-2.5 bg-morandi-800 hover:bg-morandi-700 text-morandi-200 text-xs font-semibold rounded-xl"
                            >
                                取消
                            </button>
                            <button
                                type="button"
                                onClick={handleConfirm}
                                class="px-6 py-2.5 bg-[#B5BDB9] hover:bg-white text-morandi-900 text-xs font-bold rounded-xl shadow-lg transition-all"
                            >
                                套用此背景
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function TimerView({
            mode, setMode,
            timerType, setTimerType,
            seconds, elapsedStopwatch,
            isRunning, toggleTimer, resetTimer,
            sessionCount, tasks, selectedTaskId, setSelectedTaskId,
            setIsEditingTaskModal, setEditingTaskData
        }) {
            const modes = [
                { id: 'focus', name: '專注', badge: null, icon: 'fa-clock' },
                { id: 'shortBreak', name: '短暫休息', badge: '休息 5分鐘', icon: 'fa-mug-hot' },
                { id: 'longBreak', name: '長時間休息', badge: null, icon: 'fa-bed' }
            ];

            const formatDisplayTime = (totalSec) => {
                const hrs = Math.floor(totalSec / 3600);
                const mins = Math.floor((totalSec % 3600) / 60);
                const secs = totalSec % 60;
                
                if (hrs > 0) {
                    return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                }
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            };

            return (
                <div class="flex flex-col items-center justify-center py-4">
                    {/* Top Mode Selector Tabs */}
                    <div class="flex flex-wrap justify-center gap-2 md:gap-4 mb-8 bg-morandi-900/80 p-2 rounded-full border border-morandi-700/50">
                        {modes.map(m => (
                            <div key={m.id} class="relative">
                                {m.badge && (
                                    <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-[#B5BDB9] text-morandi-900 text-[10px] px-2 py-0.5 rounded-full font-bold shadow-sm whitespace-nowrap">
                                        {m.badge}
                                    </div>
                                )}
                                <button
                                    disabled={isRunning}
                                    onClick={() => setMode(m.id)}
                                    class={`px-5 py-2.5 rounded-full text-sm font-medium transition-all flex items-center space-x-2 ${
                                        mode === m.id
                                            ? 'bg-morandi-600 text-[#B5BDB9] font-bold shadow-lg ring-2 ring-[#B5BDB9]/40'
                                            : 'text-morandi-200 hover:text-white hover:bg-morandi-700/40'
                                    } ${isRunning ? 'opacity-50 cursor-not-allowed' : ''}`}
                                >
                                    <i class={`fa-solid ${m.icon}`}></i>
                                    <span>{m.name}</span>
                                </button>
                            </div>
                        ))}
                    </div>

        function StatsView({ records, tasks, generateMockData }) {
            const [statsPeriod, setStatsPeriod] = React.useState('weekly');

            const stats = React.useMemo(() => {
                const todayStr = formatDate(new Date());

                const todayFocusSec = records
                    .filter(r => r.date === todayStr && r.mode === 'focus')
                    .reduce((acc, r) => acc + r.durationSeconds, 0);

                const uniqueDates = Array.from(new Set(records.map(r => r.date))).sort();
                const totalActiveDays = uniqueDates.length;

                let currentStreak = 0;
                let maxStreak = 0;
                let tempStreak = 0;

                if (uniqueDates.length > 0) {
                    let checkDate = new Date();
                    let dateIdx = 0;
                    while (true) {
                        const dateStr = formatDate(checkDate);
                        if (uniqueDates.includes(dateStr)) {
                            currentStreak++;
                            checkDate.setDate(checkDate.getDate() - 1);
                        } else if (dateIdx === 0) {
                            checkDate.setDate(checkDate.getDate() - 1);
                            dateIdx++;
                        } else {
                            break;
                        }
                    }

                    let prevDate = null;
                    uniqueDates.forEach(dStr => {
                        const d = new Date(dStr);
                        if (!prevDate) {
                            tempStreak = 1;
                        } else {
                            const diffDays = Math.round((d - prevDate) / (1000 * 3600 * 24));
                            if (diffDays === 1) {
                                tempStreak++;
                            } else {
                                tempStreak = 1;
                            }
                        }
                        if (tempStreak > maxStreak) maxStreak = tempStreak;
                        prevDate = d;
                    });
                }

                const now = new Date();
                const currentDayOfWeek = now.getDay() === 0 ? 7 : now.getDay();
                const startOfWeek = new Date(now);
                startOfWeek.setDate(now.getDate() - (currentDayOfWeek - 1));
                
                const weeklyRecords = records.filter(r => {
                    const rDate = new Date(r.date);
                    return rDate >= new Date(formatDate(startOfWeek));
                });

                const weeklyFocusSec = weeklyRecords
                    .filter(r => r.mode === 'focus')
                    .reduce((acc, r) => acc + r.durationSeconds, 0);

                const weeklyRestSec = weeklyRecords
                    .filter(r => r.mode === 'shortBreak' || r.mode === 'longBreak')
                    .reduce((acc, r) => acc + r.durationSeconds, 0);

                const weeklySessions = weeklyRecords.filter(r => r.mode === 'focus').length;

                const taskDurationMap = {};
                weeklyRecords.forEach(r => {
                    if (!taskDurationMap[r.taskId]) taskDurationMap[r.taskId] = 0;
                    taskDurationMap[r.taskId] += r.durationSeconds;
                });

                const topTasks = Object.keys(taskDurationMap)
                    .map(tid => {
                        const tObj = tasks.find(t => t.id === tid);
                        return {
                            name: tObj ? tObj.name : '未命名項目',
                            color: tObj ? tObj.color : '#81A396',
                            hours: (taskDurationMap[tid] / 3600).toFixed(1)
                        };
                    })
                    .sort((a, b) => b.hours - a.hours);

                return {
                    todayFocusHours: (todayFocusSec / 3600).toFixed(1),
                    currentStreak: currentStreak || (totalActiveDays > 0 ? 1 : 0),
                    maxStreak: maxStreak || (totalActiveDays > 0 ? 1 : 0),
                    totalActiveDays,
                    weeklySessions,
                    weeklyFocusHours: (weeklyFocusSec / 3600).toFixed(1),
                    weeklyRestHours: (weeklyRestSec / 3600).toFixed(1),
                    dailyAvgFocusHours: (weeklyFocusSec / 3600 / 7).toFixed(1),
                    topTasks
                };
            }, [records, tasks]);

            React.useEffect(() => {
                const ctx = document.getElementById('statsChart');
                if (!ctx) return;

                const labels = [];
                const focusData = [];

                for (let i = 6; i >= 0; i--) {
                    const d = new Date(now);
                    d.setDate(now.getDate() - i);
                    const dStr = formatDate(d);
                    const dayName = ['日','一','二','三','四','五','六'][d.getDay()];
                    labels.push(`週${dayName}`);

                    const daySec = records
                        .filter(r => r.date === dStr && r.mode === 'focus')

                    focusData.push((daySec / 3600).toFixed(1));

                const existingChart = Chart.getChart('statsChart');

                                ticks: { color: '#B5BDB9' },
                                beginAtZero: true
                            }
                        }
                    }
                });
            }, [records, statsPeriod]);

                                        <div class="flex items-center space-x-3">
                                            <div class="w-4 h-4 rounded-full shadow-sm" style={{ backgroundColor: t.color }}></div>
                                            <span class="text-morandi-100 font-medium text-sm">{t.name}</span>
                                        </div>

                                        <div class="flex items-center space-x-4">
                                            <span class="text-xs text-morandi-300 font-mono">累計專注：{totalHours} 小時</span>
                                            
                                            {/* Edit Button */}
                                            <button
                                                onClick={() => openEditModal(t)}
                                                class="text-morandi-300 hover:text-[#B5BDB9] text-sm transition-colors p-1"
                                                title="編輯"
                                            >
                                                <i class="fa-solid fa-pen"></i>
                                            </button>

                                            {/* Delete Button */}
                                            <button
                                                onClick={() => handleDeleteTask(t.id)}
                                                class="text-morandi-400 hover:text-rose-400 text-sm transition-colors p-1"
                                                title="刪除"
                                            >
                                                <i class="fa-solid fa-trash-can"></i>
                                            </button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function TaskModal({ tasks, setTasks, editingTask, onClose }) {
            const [name, setName] = React.useState(editingTask ? editingTask.name : '');
            const [colorHex, setColorHex] = React.useState(editingTask ? editingTask.color : MORANDI_PALETTE[0].hex);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!name.trim()) return;

                if (editingTask) {
                    setTasks(tasks.map(t => t.id === editingTask.id ? { ...t, name: name.trim(), color: colorHex } : t));
                } else {
                    const newTask = {
                        id: Date.now().toString(),
                        name: name.trim(),
                        icon: 'fa-bookmark',
                        color: colorHex
                    };
                    setTasks([...tasks, newTask]);
                }
                onClose();
            };

            return (
                <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-morandi-800 border border-morandi-600 w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
                        <button
                            onClick={onClose}
                            class="absolute top-4 right-4 text-morandi-300 hover:text-white text-lg"
                        >
                            <i class="fa-solid fa-xmark"></i>
                        </button>

                        <h3 class="text-lg font-bold text-[#B5BDB9] mb-4">
                            {editingTask ? '編輯待辦項目' : '新增待辦目標'}
                        </h3>

                        <form onSubmit={handleSubmit} class="space-y-5">
                            <div>
                                <label class="block text-xs text-morandi-300 mb-1.5">目標名稱</label>
                                <input
                                    type="text"
                                    placeholder="輸入目標名稱..."
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    autoFocus
                                    class="w-full bg-morandi-900 border border-morandi-700 text-white rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-[#B5BDB9]"
                                />
                            </div>

                            <div>
                                <label class="block text-xs text-morandi-300 mb-2">選擇類別色彩</label>
                                <div class="grid grid-cols-4 gap-2.5">
                                    {MORANDI_PALETTE.map(item => (
                                        <button
                                            key={item.id}
                                            type="button"
                                            onClick={() => setColorHex(item.hex)}
                                            class={`h-10 rounded-xl flex items-center justify-center shadow-md transition-all ${
                                                colorHex === item.hex ? 'ring-2 ring-white scale-105 font-bold' : 'opacity-80 hover:opacity-100'
                                            }`}
                                            style={{ backgroundColor: item.hex }}
                                        >
                                            {colorHex === item.hex && (
                                                <i class="fa-solid fa-check text-white text-xs drop-shadow"></i>
                                            )}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            <div class="flex justify-end space-x-3 pt-2">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    class="px-4 py-2 bg-morandi-700 hover:bg-morandi-600 text-morandi-200 text-xs font-medium rounded-xl"
                                >
                                    取消
                                </button>
                                <button
                                    type="submit"
                                    class="px-5 py-2 bg-[#B5BDB9] hover:bg-white text-morandi-900 text-xs font-bold rounded-xl shadow-md"
                                >
                                    儲存
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
